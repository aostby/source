# Prometheus rules for Kolibri Kino: recording rules (queries computed every 30 s and kept as their own series, so the
# Grafana dashboard and ad-hoc queries are quick and the same everywhere), and alerts. The alerts only show in
# Prometheus (Alerts) and Grafana (Alerting → Alert rules, data source Prometheus); nothing is sent anywhere.
groups:
  - name: kolibri-recording
    interval: 30s
    rules:
      # Both services: up (1) or not (0), and how long they have run.
      - record: kolibri:up
        expr: max by (job) (up{job=~"kmdb|kino"})

      # Requests per second and share of 5xx answers per service, without the monitoring endpoints themselves.
      - record: kolibri:http_requests:rate5m
        expr: sum by (job) (rate(http_server_request_duration_seconds_count{http_route!~"/metrics|/health|/ping"}[5m]))
      - record: kolibri:http_errors:ratio5m
        expr: |
          sum by (job) (rate(http_server_request_duration_seconds_count{http_route!~"/metrics|/health|/ping",http_response_status_code=~"5.."}[5m]))
          / clamp_min(sum by (job) (rate(http_server_request_duration_seconds_count{http_route!~"/metrics|/health|/ping"}[5m])), 1e-9)

      # Response time per service and per route (p50, p95).
      - record: kolibri:http_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (job, le) (rate(http_server_request_duration_seconds_bucket{http_route!~"/metrics|/health|/ping"}[5m])))
      - record: kolibri:http_latency:p50_5m
        expr: histogram_quantile(0.50, sum by (job, le) (rate(http_server_request_duration_seconds_bucket{http_route!~"/metrics|/health|/ping"}[5m])))
      - record: kolibri:http_route_latency:p95_5m
        expr: histogram_quantile(0.95, sum by (job, http_route, le) (rate(http_server_request_duration_seconds_bucket{http_route!~"/metrics|/health|/ping"}[5m])))

      # Health per part, both services in one series: 1 healthy, 0.5 degraded, 0 unhealthy.
      - record: kolibri:health
        expr: label_replace(kmdb_health_status, "service", "kmdb", "", "") or label_replace(kino_health_status, "service", "kino", "", "")

      # KMDb: OMDb lookups per second by kind and result, and share not found.
      - record: kolibri:omdb_requests:rate5m
        expr: sum by (kind, result) (rate(kmdb_omdb_requests_total[5m]))
      - record: kolibri:omdb_not_found:ratio1h
        expr: sum(increase(kmdb_omdb_requests_total{result="not_found"}[1h])) / clamp_min(sum(increase(kmdb_omdb_requests_total[1h])), 1)

      # KMDb: sync from WinForms/Kino per collection, and posters fetched (found or not).
      - record: kolibri:sync_documents:increase1h
        expr: sum by (collection, changed) (increase(kmdb_sync_documents_total[1h]))
      - record: kolibri:posters_fetched:increase1h
        expr: sum by (found) (increase(kmdb_posters_fetched_total[1h]))

      # Kino web: library storage (1 = MariaDB through KMDb, 0 = LiteDB file) and changes waiting for KMDb.
      - record: kolibri:kino_uses_kmdb
        expr: max(kino_storage_kmdb)
      - record: kolibri:kino_pending_changes
        expr: max(kino_storage_pending)

      # MariaDB connections in use per pool (KMDb: imdb, silverscreen), and memory per service.
      - record: kolibri:db_connections_used
        expr: sum by (pool_name) (db_client_connections_usage{state="used"})
      - record: kolibri:memory_bytes
        expr: max by (job) (dotnet_process_memory_working_set_bytes)

  - name: kolibri-alerts
    rules:
      - alert: KolibriServiceDown
        expr: kolibri:up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} svarer ikke på /metrics"
          description: "Containeren for {{ $labels.job }} på NAS-en er nede eller henger (docker compose ps / logs)."
      - alert: KolibriImdbDatabaseDown
        expr: kmdb_health_status{check="imdb"} < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: IMDb-databasen (MariaDB på HTPC) svarer ikke
          description: "KMDb sitt OMDb-API kan ikke svare. http://greenlantern:8086/health viser feilen."
      - alert: KolibriLibraryDatabaseDown
        expr: kmdb_health_status{check="silverscreen"} < 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: SilverScreen-databasen i MariaDB svarer ikke
          description: "Kino bruker LiteDB-fila så lenge. http://greenlantern:8086/health viser feilen."
      - alert: KolibriKinoOnLiteDb
        expr: kino_health_status{check="storage"} < 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Kino bruker LiteDB-fila selv om KMDb er satt opp
          description: "Endringer samles opp ({{ with query \"kolibri:kino_pending_changes\" }}{{ . | first | value }}{{ end }}) og sendes når KMDb svarer igjen."
      - alert: KolibriKinoLibraryDown
        expr: kino_health_status{check="library"} < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Kino får ikke lest biblioteket
          description: "Verken KMDb eller LiteDB-fila svarer for Kino. http://greenlantern:8085/health viser feilen."
      - alert: KolibriPlexPostersMissing
        expr: kmdb_health_status{check="plex"} < 1
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: KMDb har ikke fått Plex-plakatlisten på 30 minutter
          description: "Plex på HTPC svarer trolig ikke. Plakater som bare Plex har, blir ikke hentet."
      - alert: KolibriHighErrorRate
        expr: kolibri:http_errors:ratio5m > 0.05 and kolibri:http_requests:rate5m > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Over 5 % av svarene fra {{ $labels.job }} er feil (5xx)"
          description: "Se loggen til {{ $labels.job }} og Responses by status i Grafana."
      - alert: KolibriSlowResponses
        expr: kolibri:http_latency:p95_5m > 3
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} svarer tregt (p95 over 3 s)"
          description: "Ofte MariaDB på HTPC eller Plex. Se Requests per route i Grafana."
