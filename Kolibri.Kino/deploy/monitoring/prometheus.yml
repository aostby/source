# Prometheus for Kolibri.Kino.KMDb (compose profile "monitoring"). Scrapes KMDb's /metrics (OpenTelemetry, no key needed).
# Another Prometheus or Grafana Alloy can scrape the same address: http://<nas>:8086/metrics
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: kmdb
    metrics_path: /metrics
    static_configs:
      - targets: ["kmdb:8080"]
